<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social-Media</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mainContainer">
      <!-- Navbar goes here -->
      <nav class="navbar section">
        here goes the navbar
      </nav>

      <div class="hero">
        <!-- Side Menu goes here -->
        <aside class="sideMenu section" style="grid-area: sideMenu">
          here goes the sideMenu
        </aside>

        <div class="postsAndStoriesContainer overflowController" style="grid-area: postsAndStoriesContainer; overflow-y:auto; max-height: 100%;">
          <!-- Stories goes here -->
        <section class="stories section" >
          here goes the stories
          </section>

        <!-- AddPost goes here -->
        <section class="addPost section">
          here goes the addpost
        </section>

        <!-- Posts goes here -->
        <article class="posts section">
          here goes the Posts
          </article>
        </div>

        <!-- Messages goes here -->
        <aside class="messages section overflowController" style="grid-area: messages">
          here goes the Messages
          </aside>

        <!-- Friend Requests goes here -->
        <aside class="requests section overflowController" style="grid-area: requests;">
          here goes the Requests
          </aside>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
