<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social-Media</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
<link
  rel="stylesheet"

/>



  </head>
  <body>
    <div class="mainContainer">
      <!-- Navbar goes here -->
      

<header class="navbar">
  <div class="navbar-left">
    <h1 class="logo"><i class="fas fa-hashtag"></i>Chandan Gupta</h1>
  </div>

  <div class="navbar-center">
    <input type="text" class="searchBar" placeholder="Search...">
  </div>

  <div class="navbar-right">
    <a href="#"><i class="fas fa-bell"></i></a>
    <a href="#"><i class="fas fa-envelope"></i></a>
    <a href="#"><i class="fas fa-user-circle"></i></a>
  </div>
</header>





      
      <div class="hero">
        <!-- Side Menu goes here -->
        <aside class="sideMenuWrapper" style="grid-area: sideMenu">
          <div class="backgroundBox"></div> 
          <div class="sideMenu">
            <ul class="menuList">
              <li class="menuItem active">
                <a href="#"><i class="fas fa-home"></i> Home</a>
              </li>
              <li class="menuItem">
                <a href="#"><i class="fas fa-comment"></i> Messages</a>
              </li>
              <li class="menuItem">
                <a href="#"><i class="fas fa-bell"></i> Notifications</a>
              </li>
              <li class="menuItem">
                <a href="#"><i class="fas fa-user"></i> Profile</a>
              </li>
              <li class="menuItem">
                <a href="#"><i class="fas fa-cog"></i> Settings</a>
              </li>
              <li class="menuItem">
                <a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a>
              </li>
            </ul>
          </div>
        </aside>
        
        
        </aside>
        

        <div class="postsAndStoriesContainer overflowController" style="grid-area: postsAndStoriesContainer; overflow-y:auto; max-height: 100%;">
          <!-- Stories goes here -->
        <section class="stories section" >
          <!-- Stories goes here -->
<section class="stories section">
  <h2 class="section-title">Stories</h2>
  <div class="storiesContainer">
    <!-- Add Story -->
    <div class="storyCard addStory">
      <img src="your-profile.jpg" alt="Your Story">
      <span class="addIcon"><i class="fas fa-plus"></i></span>
      <p>Your Story</p>
    </div>

    <!-- Example Story 1 -->
    <div class="storyCard">
      <img src="user1.jpg" alt="User 1">
      <p>User 1</p>
    </div>

    <!-- Example Story 2 -->
    <div class="storyCard">
      <img src="user2.jpg" alt="User 2">
      <p>User 2</p>
    </div>

    <!-- Example Story 3 -->
    <div class="storyCard">
      <img src="user3.jpg" alt="User 3">
      <p>User 3</p>
    </div>
    
    <!-- More stories can go here -->
  </div>
</section>

          
            
          </section>

        <!-- AddPost goes here -->
        <section class="addPost section">
          here goes the addpost
        </section>

        <!-- Posts goes here -->
        <article class="posts section">
          here goes the Posts
          </article>
        </div>

        <!-- Messages goes here -->
        <aside class="messages section overflowController" style="grid-area: messages">
          here goes the Messages
          </aside>

        <!-- Friend Requests goes here -->
        <aside class="requests section overflowController" style="grid-area: requests;">
          here goes the Requests
          </aside>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
